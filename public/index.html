<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARKGO - Panel de Portería</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Encabezado -->
  <header class="bg-blue-900 text-white shadow-lg p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-wider">PARKGO <span class="text-sm font-normal text-blue-300">| Portería</span></h1>
    <div id="userInfo" class="text-sm hidden">
      <span id="userRole" class="bg-blue-700 px-3 py-1 rounded-full font-semibold">Guarda</span>
      <button onclick="logout()" class="ml-3 text-red-300 hover:text-red-100 underline text-xs">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- FORMULARIO DE LOGIN (Modal si no hay Token) -->
    <section id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border mt-10">
      <h2 class="text-xl font-bold text-center mb-6 text-blue-900">Iniciar Sesión Portería</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Correo Corporativo</label>
          <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 border-slate-300">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Contraseña</label>
          <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 border-slate-300">
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white py-2 rounded-md font-semibold hover:bg-blue-800 transition">Ingresar</button>
      </form>
    </section>

    <!-- PANEL DE CONTROL (Se muestra tras iniciar sesión) -->
    <div id="dashboardSection" class="hidden space-y-6">

      <!-- Buscador por Código -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">Buscador / Validación Directa</h2>
        <form id="searchForm" class="flex gap-3">
          <input type="text" id="codigoPase" placeholder="Ingrese o escanee código (Ej: PARK-8892)" required
            class="flex-1 p-3 border border-slate-300 rounded-lg text-lg uppercase focus:ring-2 focus:ring-blue-500">
          <button type="submit" class="bg-blue-900 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-800 transition">
            Validar
          </button>
        </form>
      </section>

      <!-- Catálogo de Cupos y Vehículos -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-700">Catálogo de Cupos y Vehículos</h2>
          <!-- Filtros -->
          <div class="flex gap-2">
            <button onclick="filtrarCatalogo('TODOS')" class="px-3 py-1 bg-slate-200 text-slate-700 rounded-full text-xs font-semibold hover:bg-slate-300">Todos</button>
            <button onclick="filtrarCatalogo('RESERVADO')" class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold hover:bg-amber-200">Reservados</button>
            <button onclick="filtrarCatalogo('OCUPADO')" class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-semibold hover:bg-red-200">Ocupados</button>
          </div>
        </div>

        <!-- Rejilla de Tarjetas (Grid Dinámico) -->
        <div id="gridCatalogo" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Las tarjetas de vehículos/cupos se cargan con JS -->
        </div>
      </section>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
